services:
  postgres:
    image: postgres:15-alpine
    container_name: metrology-postgres
    environment:
      POSTGRES_DB: metrology
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - metrology-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrology"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  metrology-pgdata: